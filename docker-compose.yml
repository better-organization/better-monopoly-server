  #     POSTGRES_PASSWORD: password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - better-monopoly

  # Add Redis service when needed
  # redis:
  #   image: redis:7-alpine
