version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: better-monopoly-server-dev
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=development
      - PORT=8080
      - FRONTEND_URL=http://localhost:3000
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - better-monopoly-dev
    command: yarn dev

networks:
  better-monopoly-dev:
    driver: bridge
